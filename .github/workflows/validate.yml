name: Validate MVP
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v5
        with:
          version: '12.3.4'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libnss3 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: node scripts/python.mjs initialize
      - run: node scripts/python.mjs lint
      - run: node scripts/python.mjs format
      - run: node scripts/python.mjs types
      - run: node scripts/python.mjs test
      - run: pnpm check-api
      - run: pnpm --dir frontend lint:no-fix
      - run: pnpm --dir frontend test
      - run: pnpm _build-frontend
